<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Brandon & Lani{% endblock title %}</title>
    <meta
      name="description"
      content="{% block description %}Our wedding website{% endblock description %}" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&display=swap"
      rel="stylesheet" />

    <!-- styles -->
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}" />

    {% block head %}{% endblock head %}
  </head>
  <body>
    <!-- site -->
    <div id="site" style="display: none">
      <nav class="nav">
        <a href="{{ get_url(path='/') }}" class="nav-name">Brandon & Lani</a>
        <div class="lang-toggle">
          {% if lang == "zh" %}
          <a href="{{ get_url(path='/') }}">EN</a>
          <span>·</span>
          <span class="active">中文</span>
          {% else %}
          <span class="active">EN</span>
          <span>·</span>
          <a href="{{ get_url(path='/zh') }}">中文</a>
          {% endif %}
        </div>
      </nav>

      <main>{% block content %}{% endblock content %}</main>

      <footer class="footer">
        <p>Brandon & Lani &middot; <span id="wedding-date"></span></p>
      </footer>
    </div>

    {% block scripts %}{% endblock scripts %}
  </body>
</html>
